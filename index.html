<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B1B1B" />
    <title>Eyad Amir | AI/ML Engineer in training</title>
    <meta
      name="description"
      content="Eyad Amir, Computer & Communication Engineering student at Alexandria University. Explore practical Python, machine learning, and data projects."
    />
    <meta
      property="og:title"
      content="Eyad Amir | AI/ML Engineer in training"
    />
    <meta
      property="og:description"
      content="Engineering thoughtful solutions with Python, machine learning, and data. Open to internships and collaboration."
    />

    <meta property="og:image" content="https://eyad-amir.github.io/eyad-amir-portfolio/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem("eyad-theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
